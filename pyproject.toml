# Tooling configuration. The project itself is a plain Django app and is not
# packaged for distribution, so there is no [project] table here.

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["demo_model", "models", "staticfiles", "migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    # `isinstance(x, (list, tuple))` reads better than `isinstance(x, list | tuple)`
    # and is what most Python developers expect to see.
    "UP038",
]

[tool.ruff.lint.per-file-ignores]
# Settings legitimately defines names that are never read in this module.
"movie_recommendation/settings.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["movie_recommendation", "recommender", "training"]
